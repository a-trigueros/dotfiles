schema_version: "1.1"
name: batch-import-allowpartial
expected_outcome: |
  The allowPartial option travels in the query string of the POST route
  (execution variability of the import), not in the body DTO; the body
  carries only the product lines. Unknown or invalid flag value rejected
  with 400 Problem Details naming the flag (no silent default fallback);
  camelCase flag documented in OpenAPI with its default; plural route with
  /api/v1 defaults; import result returned with its counts.
